<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}WattWise{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <meta name="supabase-url" content="{{ supabase_url or '' }}">
  <meta name="supabase-anon-key" content="{{ supabase_key or '' }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    (function() {
      const saved = localStorage.getItem('econet-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      if (window.isNativeApp || window.pywebview) {
        document.body?.classList.add('native-app');
        document.addEventListener('DOMContentLoaded', () => document.body.classList.add('native-app'));
      }
    })();
  </script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-brand">
        <svg class="sidebar-logo" width="28" height="28" viewBox="0 0 512 512" fill="none">
          <defs><linearGradient id="ww-brand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#10B981"/></linearGradient></defs>
          <path d="M134 433c0-218 164-273 245-354 0 136-27 245-136 300" stroke="url(#ww-brand)" stroke-width="11" stroke-linecap="round" fill="none"/>
          <path d="M134 432c50-95 112-169 193-207" stroke="url(#ww-brand)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55"/>
          <circle cx="134" cy="433" r="18" fill="#10B981"/>
        </svg>
        <span class="sidebar-title">WattWise</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="sidebar-link{% if request.url.path == '/dashboard' %} active{% endif %}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="/schedule" class="sidebar-link{% if request.url.path == '/schedule' %} active{% endif %}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span>Optimize</span>
        </a>
        <a href="/history" class="sidebar-link{% if request.url.path == '/history' %} active{% endif %}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span>History</span>
        </a>
        <a href="/settings" class="sidebar-link{% if request.url.path == '/settings' %} active{% endif %}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span>Settings</span>
        </a>
        <a href="/help" class="sidebar-link{% if request.url.path == '/help' %} active{% endif %}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span>Help</span>
        </a>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <button class="sidebar-link sidebar-search-btn" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'k',metaKey:true}))">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Search</span>
        <kbd class="sidebar-kbd">&#8984;K</kbd>
      </button>
      <a id="connection-link" href="#" class="sidebar-link sidebar-conn" title="Connected">
        <svg id="conn-icon-linked" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>
        <svg id="conn-icon-broken" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M16.5 9.4l-9-5.19"/>
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke="var(--danger)"/>
        </svg>
        <span id="conn-label">Connected</span>
      </a>
      <!-- Connection popover -->
      <div class="conn-popover" id="conn-popover">
        <div id="conn-pop-content" style="font-size:.82rem;line-height:1.6">Loading...</div>
      </div>
      <div class="sidebar-user">
        <a id="user-menu-btn" href="/login" class="sidebar-link" title="Sign in">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span id="user-label">Sign in</span>
        </a>
        <div id="user-dropdown" style="display:none;position:absolute;left:100%;bottom:0;margin-left:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius, 8px);box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:180px;z-index:200;padding:.5rem 0">
          <div id="user-dropdown-email" style="padding:.5rem 1rem;font-size:.8rem;color:var(--text-muted);border-bottom:1px solid var(--border);word-break:break-all"></div>
          <a href="/settings" style="display:block;padding:.5rem 1rem;font-size:.85rem;color:var(--text);text-decoration:none">Settings</a>
          <a href="/logout" style="display:block;padding:.5rem 1rem;font-size:.85rem;color:var(--danger);text-decoration:none"
             onclick="supabaseAuth.clearSession()">Sign out</a>
        </div>
      </div>
      <button class="sidebar-link" onclick="toggleTheme()" title="Toggle theme">
        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span id="theme-label">Appearance</span>
      </button>
    </div>
  </aside>

  <main class="app-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Backfill progress bar -->
  <div id="backfill-bar" style="display:none;position:fixed;bottom:0;left:200px;right:0;background:var(--surface);border-top:1px solid var(--border);padding:.5rem 1.5rem;z-index:100;font-size:.82rem">
    <div style="display:flex;align-items:center;gap:1rem">
      <span class="spinner"></span>
      <span id="backfill-text">Loading historical data…</span>
      <div style="flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden">
        <div id="backfill-progress" style="height:100%;background:var(--accent);width:0%;transition:width .3s"></div>
      </div>
      <span id="backfill-pct" style="color:var(--text-muted)">0%</span>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="assertive" aria-atomic="false"></div>

  <script>
  // ---- Theme ----
  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('econet-theme', next);
    updateThemeIcon(next);
  }
  function updateThemeIcon(theme) {
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    if (theme === 'dark') {
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      if (label) label.textContent = 'Dark mode';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
      if (label) label.textContent = 'Light mode';
    }
  }
  updateThemeIcon(document.documentElement.getAttribute('data-theme'));

  // ---- Toast ----
  function showToast(message, type = 'info', durationMs = 4500) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast toast--${type}`;
    toast.setAttribute('role', 'alert');
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity .3s';
      setTimeout(() => toast.remove(), 350);
    }, durationMs);
  }

  // ---- fetchWithTimeout ----
  async function fetchWithTimeout(url, opts = {}, timeoutMs = 8000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...opts, signal: controller.signal });
    } finally {
      clearTimeout(id);
    }
  }

  // ---- Connection hover popover ----
  let connPopTimer = null;
  let connPopLoaded = false;
  const connLink = document.getElementById('connection-link');
  const connPopover = document.getElementById('conn-popover');

  connLink.addEventListener('mouseenter', () => {
    clearTimeout(connPopTimer);
    connPopover.classList.add('visible');
    if (!connPopLoaded) loadConnPopover();
  });
  connLink.addEventListener('mouseleave', () => {
    connPopTimer = setTimeout(() => connPopover.classList.remove('visible'), 300);
  });
  connPopover.addEventListener('mouseenter', () => clearTimeout(connPopTimer));
  connPopover.addEventListener('mouseleave', () => {
    connPopTimer = setTimeout(() => connPopover.classList.remove('visible'), 200);
  });

  async function loadConnPopover() {
    try {
      const [statusR, deviceR] = await Promise.all([
        fetch('/api/config/status'),
        fetch('/api/device'),
      ]);
      const status = await statusR.json();
      const device = deviceR.ok ? await deviceR.json() : null;
      const el = document.getElementById('conn-pop-content');
      const loc = device && device.location;
      const modeLabels = {OFF:'Off',ENERGY_SAVING:'Energy Saving',HEAT_PUMP_ONLY:'Heat Pump',HIGH_DEMAND:'High Demand',ELECTRIC_MODE:'Electric',VACATION:'Vacation'};

      let html = '<div style="font-weight:700;font-size:.9rem;margin-bottom:.5rem">';
      html += status.connected ? '<span style="color:var(--success)">Connected</span>' : '<span style="color:var(--danger)">Disconnected</span>';
      html += status.mqtt_connected ? ' <span style="font-size:.72rem;color:var(--success)">(MQTT Live)</span>' : ' <span style="font-size:.72rem;color:var(--warn)">(Polling)</span>';
      html += '</div>';

      if (device) {
        const rows = [
          ['Device', device.name || '—'],
          ['Location', loc ? `${loc.city}, ${loc.state} ${loc.zipcode}` : '—'],
          ['Mode', modeLabels[device.mode] || device.mode || '—'],
          ['Status', device.running ? `<span style="color:var(--success)">${device.running_state || 'Running'}</span>` : 'Idle'],
          ['Setpoint', `${device.setpoint}°F`],
          ['Hot Water', device.hot_water_avail != null ? `${device.hot_water_avail}%` : '—'],
        ];
        html += rows.map(([k,v]) => `<div class="conn-pop-row"><span class="conn-pop-label">${k}</span><span class="conn-pop-value">${v}</span></div>`).join('');
      }

      if (status.last_poll) {
        html += `<div class="conn-pop-row"><span class="conn-pop-label">Last poll</span><span class="conn-pop-value">${new Date(status.last_poll).toLocaleTimeString()}</span></div>`;
      }

      el.innerHTML = html;
      connPopLoaded = true;
      // Refresh every 30s while visible
      setTimeout(() => { connPopLoaded = false; }, 30000);
    } catch (e) {
      document.getElementById('conn-pop-content').textContent = 'Failed to load';
    }
  }

  // ---- Connection icon ----
  async function updateConnectionBadge() {
    try {
      const r = await fetch('/api/config/status');
      const d = await r.json();
      const link = document.getElementById('connection-link');
      const iconLinked = document.getElementById('conn-icon-linked');
      const iconBroken = document.getElementById('conn-icon-broken');
      const connLabel = document.getElementById('conn-label');
      if (d.connected) {
        link.href = '#';
        link.title = 'Connected to EcoNet';
        iconLinked.style.display = '';
        iconBroken.style.display = 'none';
        if (connLabel) connLabel.textContent = 'Connected';
        link.classList.add('active');
      } else {
        link.href = '/settings';
        link.title = 'Disconnected — click to configure';
        iconLinked.style.display = 'none';
        iconBroken.style.display = '';
        if (connLabel) connLabel.textContent = 'Disconnected';
        link.classList.remove('active');
      }
    } catch {}
  }
  updateConnectionBadge();
  setInterval(updateConnectionBadge, 30000);

  // ---- Backfill progress polling ----
  let backfillDone = false;
  async function checkBackfill() {
    if (backfillDone) return;
    try {
      const r = await fetch('/api/backfill-status');
      const d = await r.json();
      const bar = document.getElementById('backfill-bar');
      if (d.running) {
        bar.style.display = 'block';
        const pct = d.total > 0 ? Math.round((d.done / d.total) * 100) : 0;
        document.getElementById('backfill-progress').style.width = pct + '%';
        document.getElementById('backfill-pct').textContent = pct + '%';
        document.getElementById('backfill-text').textContent =
          `Loading historical data… ${d.current_date}` + (d.errors > 0 ? ` (${d.errors} errors)` : '');
      } else if (bar.style.display !== 'none' && d.done > 0) {
        bar.style.display = 'none';
        backfillDone = true;
        showToast(`Historical data loaded (${d.done} days)`, 'success');
      } else {
        bar.style.display = 'none';
      }
    } catch {}
  }
  checkBackfill();
  setInterval(checkBackfill, 3000);
  </script>
  <!-- Command palette (Cmd+K) -->
  <div class="cmdk-overlay" id="cmdk-overlay">
    <div class="cmdk-dialog" id="cmdk-dialog">
      <div class="cmdk-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="cmdk-input" id="cmdk-input" type="text" placeholder="Search pages, actions, settings..." autocomplete="off" spellcheck="false">
        <span class="cmdk-kbd">esc</span>
      </div>
      <div class="cmdk-list" id="cmdk-list"></div>
      <div class="cmdk-footer">
        <span><span class="cmdk-kbd">&uarr;&darr;</span> navigate</span>
        <span><span class="cmdk-kbd">&crarr;</span> select</span>
        <span><span class="cmdk-kbd">esc</span> close</span>
      </div>
    </div>
  </div>
  <script>
  (function() {
    function svgIcon(paths) { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>'; }
    const I = {
      grid: svgIcon('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
      optimize: svgIcon('<path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/>'),
      activity: svgIcon('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'),
      gear: svgIcon('<circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44"/>'),
      help: svgIcon('<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>'),
      refresh: svgIcon('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>'),
      cloud: svgIcon('<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>'),
      download: svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
      moon: svgIcon('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
      flame: svgIcon('<path d="M12 2c-4 4-7 8-7 12a7 7 0 0 0 14 0c0-4-3-8-7-12z"/>'),
      zap: svgIcon('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10"/>'),
      key: svgIcon('<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zM15.5 7.5l-3.11 3.11"/><line x1="18" y1="4" x2="21" y2="7"/>'),
      dollar: svgIcon('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
      target: svgIcon('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>'),
      user: svgIcon('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
      logout: svgIcon('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'),
    };
    const commands = [
      { group: 'Pages', icon: I.grid, label: 'Dashboard', desc: 'Overview and controls', action: () => location.href='/dashboard' },
      { group: 'Pages', icon: I.optimize, label: 'Optimize', desc: 'Savings plan and scheduling', action: () => location.href='/schedule' },
      { group: 'Pages', icon: I.activity, label: 'History', desc: 'Energy usage history', action: () => location.href='/history' },
      { group: 'Pages', icon: I.gear, label: 'Settings', desc: 'Device, rates, preferences', action: () => location.href='/settings' },
      { group: 'Pages', icon: I.help, label: 'Help', desc: 'Documentation and guides', action: () => location.href='/help' },
      { group: 'Actions', icon: I.refresh, label: 'Refresh Data', desc: 'Force poll from EcoNet', action: () => { cmdkClose(); fetch('/api/refresh',{method:'POST'}).then(()=>showToast('Data refreshed','success')).catch(()=>showToast('Refresh failed','error')); }},
      { group: 'Actions', icon: I.cloud, label: 'Sync to Cloud', desc: 'Push data to Supabase', action: () => { cmdkClose(); location.href='/settings#cloud-sync'; }},
      { group: 'Actions', icon: I.download, label: 'Export Data', desc: 'Download CSV export', action: () => { cmdkClose(); location.href='/history'; }},
      { group: 'Actions', icon: I.moon, label: 'Toggle Theme', desc: 'Switch light/dark mode', action: () => { cmdkClose(); toggleTheme(); }},
      { group: 'Device', icon: I.flame, label: 'Set Temperature', desc: 'Adjust water heater setpoint', action: () => { cmdkClose(); location.href='/dashboard'; }},
      { group: 'Device', icon: I.zap, label: 'Change Mode', desc: 'Switch operating mode', action: () => { cmdkClose(); location.href='/dashboard'; }},
      { group: 'Device', icon: I.optimize, label: 'Generate Plan', desc: 'AI-optimized savings schedule', action: () => { cmdkClose(); location.href='/schedule'; }},
      { group: 'Settings', icon: I.key, label: 'EcoNet Credentials', desc: 'Update login for EcoNet', action: () => { cmdkClose(); location.href='/settings'; }},
      { group: 'Settings', icon: I.dollar, label: 'TOU Rates', desc: 'Edit electricity rate tiers', action: () => { cmdkClose(); location.href='/settings'; }},
      { group: 'Settings', icon: I.target, label: 'Comfort Preferences', desc: 'Setpoint and recovery prefs', action: () => { cmdkClose(); location.href='/settings'; }},
      { group: 'Account', icon: I.user, label: 'Sign In', desc: 'Log in with Supabase', action: () => location.href='/login', show: () => !supabaseAuth.isAuthenticated() },
      { group: 'Account', icon: I.logout, label: 'Sign Out', desc: 'Log out of your account', action: () => { supabaseAuth.clearSession(); location.href='/logout'; }, show: () => supabaseAuth.isAuthenticated() },
    ];

    const overlay = document.getElementById('cmdk-overlay');
    const dialog = document.getElementById('cmdk-dialog');
    const input = document.getElementById('cmdk-input');
    const list = document.getElementById('cmdk-list');
    let activeIdx = 0;
    let filtered = [];

    function cmdkOpen() {
      overlay.classList.add('visible');
      input.value = '';
      activeIdx = 0;
      render('');
      requestAnimationFrame(() => input.focus());
    }

    function cmdkClose() {
      overlay.classList.remove('visible');
      input.value = '';
    }
    window.cmdkClose = cmdkClose;

    function fuzzyMatch(query, text) {
      query = query.toLowerCase();
      text = text.toLowerCase();
      if (!query) return true;
      // Simple substring + word-start matching
      if (text.includes(query)) return true;
      let qi = 0;
      for (let i = 0; i < text.length && qi < query.length; i++) {
        if (text[i] === query[qi]) qi++;
      }
      return qi === query.length;
    }

    function render(query) {
      filtered = commands.filter(c => {
        if (c.show && !c.show()) return false;
        if (!query) return true;
        return fuzzyMatch(query, c.label) || fuzzyMatch(query, c.desc) || fuzzyMatch(query, c.group);
      });

      if (activeIdx >= filtered.length) activeIdx = Math.max(0, filtered.length - 1);

      if (!filtered.length) {
        list.innerHTML = '<div class="cmdk-empty">No results found</div>';
        return;
      }

      let html = '';
      let lastGroup = '';
      filtered.forEach((c, i) => {
        if (c.group !== lastGroup) {
          html += '<div class="cmdk-group-label">' + c.group + '</div>';
          lastGroup = c.group;
        }
        html += '<div class="cmdk-item' + (i === activeIdx ? ' active' : '') + '" data-idx="' + i + '">'
          + '<div class="cmdk-item-icon">' + c.icon + '</div>'
          + '<div class="cmdk-item-text"><div class="cmdk-item-label">' + c.label + '</div>'
          + '<div class="cmdk-item-desc">' + c.desc + '</div></div>'
          + '</div>';
      });
      list.innerHTML = html;

      // Scroll active item into view
      const active = list.querySelector('.cmdk-item.active');
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    input.addEventListener('input', () => {
      activeIdx = 0;
      render(input.value);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, filtered.length - 1);
        render(input.value);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, 0);
        render(input.value);
      } else if (e.key === 'Enter' && filtered[activeIdx]) {
        e.preventDefault();
        filtered[activeIdx].action();
      } else if (e.key === 'Escape') {
        cmdkClose();
      }
    });

    list.addEventListener('click', (e) => {
      const item = e.target.closest('.cmdk-item');
      if (!item) return;
      const idx = parseInt(item.dataset.idx, 10);
      if (filtered[idx]) filtered[idx].action();
    });

    list.addEventListener('mousemove', (e) => {
      const item = e.target.closest('.cmdk-item');
      if (!item) return;
      const idx = parseInt(item.dataset.idx, 10);
      if (idx !== activeIdx) {
        activeIdx = idx;
        render(input.value);
      }
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) cmdkClose();
    });

    // Keyboard shortcut: Cmd+K (Mac) or Ctrl+K (others)
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        if (overlay.classList.contains('visible')) cmdkClose();
        else cmdkOpen();
      }
    });
  })();
  </script>

  <script src="/static/js/auth.js"></script>
  <script>
  // Update user menu based on auth state
  (async function() {
    const btn = document.getElementById('user-menu-btn');
    const userLabel = document.getElementById('user-label');
    if (supabaseAuth.isAuthenticated()) {
      btn.href = '#';
      btn.title = 'Signed in';
      btn.classList.add('active');
      btn.onclick = function(e) {
        e.preventDefault();
        const menu = document.getElementById('user-dropdown');
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      };
      const user = await supabaseAuth.getUser();
      if (user && user.email) {
        btn.title = user.email;
        if (userLabel) userLabel.textContent = user.email.split('@')[0];
        const emailEl = document.getElementById('user-dropdown-email');
        if (emailEl) emailEl.textContent = user.email;
      } else {
        if (userLabel) userLabel.textContent = 'Account';
      }
    }
  })();
  // Close dropdown on outside click
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('user-dropdown');
    const btn = document.getElementById('user-menu-btn');
    if (menu && !menu.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
      menu.style.display = 'none';
    }
  });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
